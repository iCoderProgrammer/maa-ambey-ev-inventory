        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Stock balances of a part
      tags:
      - parts-stock
  /stock-items/{id}/issues:
    post:
      consumes:
      - application/json
      description: 'Takes the quantity from the SKU''s balance at the location by
        recording one PARTS_ISSUE movement, in one transaction with the audit event
        stock_item.issued. The balance is locked and checked: more than is there is
        409 INSUFFICIENT_STOCK and nothing changes (the database also refuses a negative
        balance). Same SKU, unit, quantity, idempotency and scope rules as receipts;
        reason is required, sourceReference (e.g. job card) optional. Requires stock.parts.issue
        and X-CSRF-Token.'
      parameters:
      - description: SKU ID
        in: path
        name: id
        required: true
        type: string
      - description: 8-100 letters, digits, - or _
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Issue
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/PartsIssueInput'
      produces:
      - application/json
      responses:
        "200":
          description: 'Recorded, or a replay (Idempotent-Replayed: true)'
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/PartsResult'
              type: object
        "400":
          description: BAD_REQUEST
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN or CSRF_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: INSUFFICIENT_STOCK, INVALID_STATE (archived SKU), TRACKING_NOT_SUPPORTED
            or IDEMPOTENCY_KEY_REUSED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED (locationId, quantity, uom, reason, sourceReference,
            note, Idempotency-Key)
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Issue (consume) parts
      tags:
      - parts-stock
  /stock-items/{id}/receipts:
    post:
      consumes:
      - application/json
      description: 'Adds the quantity to the SKU''s balance at the location by recording
        one PARTS_RECEIPT movement (balance, movement and audit stock_item.received
        in one transaction). The SKU must be ACTIVE and QUANTITY-tracked (SERIAL:
        409 TRACKING_NOT_SUPPORTED) and uom must be its unit (no conversion); quantity
        > 0 with up to 3 decimals; supplierId (not archived) and sourceReference (challan/invoice
        number) are required. Idempotency-Key is required: the same key and body by
        the same user returns the first result with Idempotent-Replayed: true and
        changes nothing; the same key with another request is 409 IDEMPOTENCY_KEY_REUSED.
        Requires stock.parts.receive, suppliers.view and X-CSRF-Token; the location
        must be in the caller''s scope.'
      parameters:
      - description: SKU ID
        in: path
        name: id
        required: true
        type: string
      - description: 8-100 letters, digits, - or _
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Receipt
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/PartsReceiptInput'
      produces:
      - application/json
      responses:
        "200":
          description: 'Recorded, or a replay (Idempotent-Replayed: true)'
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/PartsResult'
              type: object
        "400":
          description: BAD_REQUEST
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN or CSRF_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: INVALID_STATE (archived SKU), TRACKING_NOT_SUPPORTED or IDEMPOTENCY_KEY_REUSED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED (locationId, quantity, uom, supplierId, sourceReference,
            note, Idempotency-Key)
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Receive parts from a supplier
      tags:
      - parts-stock
