    post:
      consumes:
      - application/json
      description: Gets the next GRN number. The purchase order must be APPROVED or
        PARTIALLY_RECEIVED; the received date must not be in the future. Lines are
        entered with PUT. With Idempotency-Key, a repeat by the same user returns
        the first receipt with 200. Changes no stock. Requires goods_receipts.manage
        and X-CSRF-Token. Audited.
      parameters:
      - description: 8-100 letters, digits, - or _
        in: header
        name: Idempotency-Key
        type: string
      - description: Receipt
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/GoodsReceiptCreate'
      produces:
      - application/json
      responses:
        "200":
          description: Replay of an earlier create with the same Idempotency-Key
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/GoodsReceiptDetail'
              type: object
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/GoodsReceiptDetail'
              type: object
