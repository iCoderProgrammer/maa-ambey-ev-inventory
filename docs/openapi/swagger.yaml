              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN, OVER_RECEIPT_NOT_AUTHORISED or CSRF_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: OVER_RECEIPT_REQUIRES_OVERRIDE, DUPLICATE, VERSION_CONFLICT
            or INVALID_STATE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Save a draft goods receipt
      tags:
      - goods-receipts
