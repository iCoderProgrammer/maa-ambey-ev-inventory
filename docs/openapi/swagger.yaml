basePath: /api/v1
definitions:
  AccessGrant:
    properties:
      approvalReference:
        type: string
      approvedAt:
        type: string
      approvedBy:
        type: string
      permission:
        example: access.roles.view
        type: string
      status:
        enum:
        - PROPOSED
        - APPROVED
        example: PROPOSED
        type: string
    type: object
  AccessLocation:
    properties:
      code:
        example: SR1
        type: string
      id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      name:
        example: Main showroom
        type: string
    type: object
  AccessMatrixRole:
    properties:
      description:
        example: Client-confirmed role. Permissions pending owner sign-off.
        type: string
      grants:
        items:
          $ref: '#/definitions/AccessGrant'
        type: array
      key:
        example: owner
        type: string
      name:
        example: Owner
        type: string
    type: object
  AccessPermission:
    properties:
      description:
        example: View cost prices and stock valuation
        type: string
      key:
        example: catalogue.cost_price.view
        type: string
      sensitive:
        example: true
        type: boolean
    type: object
  AccessRole:
    properties:
      key:
        example: viewer
        type: string
      name:
        example: Viewer
        type: string
    type: object
  Attachment:
    properties:
      contentType:
        example: application/pdf
        type: string
      createdAt:
        example: "2026-10-13T09:30:00Z"
        type: string
      fileName:
        example: supplier-bill.pdf
        type: string
      id:
        example: 0b8f5e9a-6d3c-4f21-9a7e-2c4d6e8f0a1b
        type: string
      linked:
        example: false
        type: boolean
      locationId:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      previewable:
        example: false
        type: boolean
      sha256:
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        type: string
      sizeBytes:
        example: 482113
        type: integer
      uploadedBy:
        example: 5b0f8a52-3c1e-4d6f-9a8b-0c1d2e3f4a5b
        type: string
    type: object
  AttachmentLimits:
    properties:
      allowedTypes:
        items:
          $ref: '#/definitions/attachments.FileType'
        type: array
      maxBytes:
        example: 10485760
        type: integer
    type: object
  AttachmentLink:
    properties:
      disposition:
        example: attachment
        type: string
      expiresAt:
        example: "2026-10-13T09:35:00Z"
        type: string
      url:
        example: /api/v1/attachments/0b8f5e9a-6d3c-4f21-9a7e-2c4d6e8f0a1b/content?disposition=attachment&expires=1792834200&signature=…
        type: string
    type: object
  BrandActivationReadiness:
    properties:
      brandId:
        type: string
      checks:
