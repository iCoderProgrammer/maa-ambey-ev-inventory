      description:
        example: Client-confirmed role. Permissions pending owner sign-off.
        type: string
      grants:
        items:
          $ref: '#/definitions/AccessGrant'
        type: array
      key:
        example: owner
        type: string
      name:
        example: Owner
        type: string
    type: object
  AccessPermission:
    properties:
      description:
        example: View cost prices and stock valuation
        type: string
      key:
        example: catalogue.cost_price.view
        type: string
      sensitive:
        example: true
        type: boolean
    type: object
  AccessRole:
    properties:
      key:
        example: viewer
        type: string
      name:
        example: Viewer
        type: string
    type: object
