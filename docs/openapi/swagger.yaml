          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Start a draft goods receipt
      tags:
      - goods-receipts
  /goods-receipts/{id}:
    get:
      description: 'The receipt with every line of its purchase order (ordered, posted,
        held by other drafts, available, received, accepted, rejected, over-receipt
        authorisation, units with identifiers, warnings), documents, history and the
        caller''s actions. stockPosted is false for drafts: they change no stock.
        Requires goods_receipts.view.'
      parameters:
      - description: Goods receipt ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/GoodsReceiptDetail'
              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get a goods receipt
      tags:
      - goods-receipts
    put:
      consumes:
      - application/json
      description: 'Replaces the draft''s received date, supplier reference, notes,
        lines and units with what is sent (all or nothing). Per line: received = accepted
        + rejected; units at most the received quantity (accepted/rejected units at
        most those quantities); identifiers optional, a chassis/frame number once
        per receipt and not on another open or posted receipt (409 DUPLICATE, details
        per unit). A line above what the PO line has left (ordered - posted - other
        drafts) needs overReceiptReason from a holder of goods_receipts.over_receipt
        (else 409 OVER_RECEIPT_REQUIRES_OVERRIDE, or 403 OVER_RECEIPT_NOT_AUTHORISED
        when the reason comes from someone without it, audited DENIED). Changes no
        stock. Requires goods_receipts.manage and X-CSRF-Token. Audited.'
      parameters:
      - description: Goods receipt ID
        in: path
        name: id
        required: true
        type: string
      - description: Draft
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/GoodsReceiptSave'
      produces:
      - application/json
      responses:
        "200":
