  /vehicle-units:
    get:
      description: Newest first. q matches the unit number and the chassis/frame,
        motor, battery and charger identifiers after normalisation (trimmed, upper-case;
        part of a value is enough). Filters combine. Only units without a location
        or at a location in the caller's scope are listed; a locationId outside the
        scope is refused. unitCost and costCurrency are null, and costHidden true,
        without vehicle_units.cost.view. Requires vehicle_units.view.
      parameters:
      - description: Search unit number or identifier
        in: query
        name: q
        type: string
      - description: Lifecycle status
        enum:
        - ORDERED
        - IN_TRANSIT
        - RECEIVED_PENDING_PDI
        - QUALITY_HOLD
        - AVAILABLE
        - DISPLAY
        - RESERVED
        - SERVICE_HOLD
        - SOLD
        - DELIVERED
        - REJECTED
        - RETURN_PENDING_INSPECTION
        - RETURNED_TO_SUPPLIER
        in: query
        name: status
        type: string
      - description: Brand ID
        in: query
        name: brandId
        type: string
      - description: Variant ID
        in: query
        name: variantId
        type: string
      - description: Supplier ID
        in: query
        name: supplierId
        type: string
      - description: Purchase order ID
        in: query
        name: purchaseOrderId
        type: string
      - description: Goods receipt ID
        in: query
        name: goodsReceiptId
        type: string
      - description: Location ID (must be in the caller's scope)
        in: query
        name: locationId
        type: string
      - description: Page (from 1)
        in: query
        name: page
        type: integer
      - description: Page size (1-100, default 25)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/VehicleUnitPage'
              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED (q, status, brandId, variantId, supplierId,
            purchaseOrderId, goodsReceiptId, locationId, page, limit)
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List vehicle units
      tags:
      - vehicle-units
  /vehicle-units/{id}:
    get:
      description: The unit with its source (supplier, purchase order and line, goods
        receipt, line and captured unit, supplier reference, received date) and its
        append-only history; each history entry names its source document. The referenced
        records open through their own APIs and permissions. A unit at a location
        outside the caller's scope is 404. unitCost and costCurrency are null, and
        costHidden true, without vehicle_units.cost.view. Requires vehicle_units.view.
      parameters:
      - description: Vehicle unit ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/VehicleUnitDetail'
              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get a vehicle unit
      tags:
      - vehicle-units
  /vehicle-units/{id}/put-on-display:
    post:
      consumes:
      - application/json
      description: 'Moves an AVAILABLE unit to DISPLAY by recording one DISPLAY_ON
        stock movement (quantity 1 -> 1, location unchanged, source STAFF_ACTION).
        The unit''s status, version and the movement are written in one transaction
        with an audit event (vehicle_unit.moved). version must be the unit''s current
        version. Idempotency-Key is required: a repeat by the same user with the same
        key and body returns the first movement with 200 and Idempotent-Replayed:
        true (unit as it is now) and changes nothing; the same key with a different
        request is 409 IDEMPOTENCY_KEY_REUSED. A unit at a location outside the caller''s
        scope is 404. Requires vehicle_units.display.manage and X-CSRF-Token.'
      parameters:
      - description: Vehicle unit ID
        in: path
        name: id
        required: true
        type: string
      - description: 8-100 letters, digits, - or _
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Current version and an optional note
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/StockDisplayInput'
      produces:
      - application/json
      responses:
        "200":
          description: 'Recorded, or a replay (Idempotent-Replayed: true)'
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/StockMoveResult'
              type: object
        "400":
          description: BAD_REQUEST
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN or CSRF_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: VERSION_CONFLICT, INVALID_STATE (not AVAILABLE) or IDEMPOTENCY_KEY_REUSED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED (version, note, Idempotency-Key)
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Put a vehicle unit on display
      tags:
      - stock-movements
  /vehicle-units/{id}/take-off-display:
    post:
      consumes:
      - application/json
      description: 'Moves a DISPLAY unit back to AVAILABLE by recording one DISPLAY_OFF
        stock movement. Same rules as put-on-display: version, Idempotency-Key, one
        transaction with the audit event, replays change nothing, location scope.
        Requires vehicle_units.display.manage and X-CSRF-Token.'
      parameters:
      - description: Vehicle unit ID
        in: path
        name: id
        required: true
        type: string
      - description: 8-100 letters, digits, - or _
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Current version and an optional note
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/StockDisplayInput'
      produces:
      - application/json
      responses:
        "200":
          description: 'Recorded, or a replay (Idempotent-Replayed: true)'
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/StockMoveResult'
              type: object
        "400":
          description: BAD_REQUEST
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN or CSRF_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: VERSION_CONFLICT, INVALID_STATE (not DISPLAY) or IDEMPOTENCY_KEY_REUSED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED (version, note, Idempotency-Key)
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Take a vehicle unit off display
      tags:
      - stock-movements
swagger: "2.0"
