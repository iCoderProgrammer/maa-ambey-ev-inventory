        type: string
      - description: Search name, variant or manufacturer code
        in: query
        name: q
        type: string
      - description: Lifecycle
        enum:
        - PENDING_VERIFICATION
        - ACTIVE
        - ARCHIVED
        in: query
        name: status
        type: string
      - description: Confidence
        enum:
        - UNVERIFIED
        - SUPPLIER_CONFIRMED
        - CLIENT_APPROVED
