                data:
                  items:
                    $ref: '#/definitions/PartsBalance'
                  type: array
              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
