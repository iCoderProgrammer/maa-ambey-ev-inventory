basePath: /api/v1
definitions:
  AccessGrant:
    properties:
      approvalReference:
        type: string
      approvedAt:
        type: string
      approvedBy:
        type: string
      permission:
        example: access.roles.view
        type: string
      status:
        enum:
        - PROPOSED
        - APPROVED
        example: PROPOSED
        type: string
    type: object
  AccessLocation:
    properties:
      code:
        example: SR1
        type: string
      id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      name:
        example: Main showroom
        type: string
    type: object
  AccessMatrixRole:
