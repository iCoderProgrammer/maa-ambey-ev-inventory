          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Upload limits
      tags:
      - attachments
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Verifies username and password and starts a server-side session.
        The session token is returned only in an HttpOnly, SameSite=Strict cookie
        (`__Host-maa_session` over HTTPS, `maa_session` in local development); the
        body carries the CSRF token for later mutations. Failures are generic: unknown
        user and wrong password both return INVALID_CREDENTIALS. ACCOUNT_DISABLED
        is only returned when the password was correct. Repeated failures return 429
        with Retry-After.'
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/Session'
              type: object
        "400":
          description: VALIDATION_FAILED or BAD_REQUEST
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: INVALID_CREDENTIALS
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: ACCOUNT_DISABLED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Sign in
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the current session on the server and clears the cookie.
        Requires the session cookie and the X-CSRF-Token header.
      parameters:
      - description: CSRF token from the session
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/SignOutResult'
              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: CSRF_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Sign out
      tags:
      - auth
  /auth/session:
    get:
      description: Returns the signed-in user and a CSRF token. 401 UNAUTHENTICATED
        when no session cookie was sent; 401 SESSION_EXPIRED when the session ended
        (idle or absolute timeout, sign-out elsewhere, password change, account disabled)
        — the cookie is then cleared.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/Session'
              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Current session
      tags:
      - auth
