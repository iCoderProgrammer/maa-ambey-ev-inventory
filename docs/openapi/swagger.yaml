          $ref: '#/definitions/BrandReadinessCheck'
        type: array
      ready:
        example: false
        type: boolean
    type: object
  BrandReadinessCheck:
    properties:
      key:
        example: authorisation
        type: string
      message:
        example: Record AUTHORISED status with legal name, reference and evidence.
        type: string
      met:
        example: false
        type: boolean
      pending:
        example: false
        type: boolean
    type: object
  CatalogueAction:
    properties:
      version:
        example: 1
        type: integer
    type: object
  CatalogueArchive:
    properties:
      reason:
        type: string
      version:
        example: 1
        type: integer
    type: object
  CatalogueBrand:
