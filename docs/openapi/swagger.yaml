      - application/json
      description: 'Requires catalogue.price.approve (plus view of its type); never
        the drafter (403 SELF_APPROVAL_NOT_ALLOWED). The price must not start in the
        past (no retroactive change), its list, brand, model and variant must not
        be archived and the variant must be verified (409 APPROVAL_BLOCKED). It may
        not overlap another approved price of the same list/variant/type (409 PRICE_OVERLAP)
        unless it supersedes it: then the superseded price ends at this price''s start.
        Approved prices never change again. Refusals are audited as DENIED. Requires
        X-CSRF-Token.'
