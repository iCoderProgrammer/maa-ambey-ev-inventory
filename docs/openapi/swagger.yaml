    properties:
      contentType:
        example: application/pdf
        type: string
      createdAt:
        example: "2026-10-13T09:30:00Z"
        type: string
      fileName:
        example: supplier-bill.pdf
        type: string
      id:
        example: 0b8f5e9a-6d3c-4f21-9a7e-2c4d6e8f0a1b
        type: string
