info:
  contact: {}
  description: Multi-brand EV inventory management API. All business endpoints live
    under /api/v1.
  title: Maa Ambey Enterprises Inventory API
  version: 0.1.0
paths:
  /access/roles:
    get:
      description: Every role, its grants (PROPOSED or APPROVED with approver and
        reference) and the permission catalogue. matrixStatus is PENDING_OWNER_SIGN_OFF
        while no grant is approved. Read-only; grants change only through the audited
        cmd/access tool. Requires access.roles.view.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/RoleMatrix'
              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Role and permission matrix
      tags:
      - access
  /attachments:
    get:
      description: The caller's newest uploads (up to 50) that are not linked to a
        business record yet and are still in the caller's location scope. Requires
        attachments.view.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/Attachment'
                  type: array
              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: My unlinked uploads
      tags:
      - attachments
    post:
      consumes:
      - multipart/form-data
      description: multipart/form-data with one part named "file". The file is stored
        privately under a server-generated key; nothing about it is public. Optional
        locationId must be in the caller's location scope. The new attachment is not
        linked to a business record yet, so only the uploader can see it. Requires
        attachments.upload and X-CSRF-Token.
      parameters:
      - description: JPEG, PNG, WebP or PDF up to maxBytes
        in: formData
        name: file
        required: true
        type: file
      - description: Location the file belongs to
        in: query
        name: locationId
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/Attachment'
              type: object
        "400":
          description: VALIDATION_FAILED (no file part)
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN or CSRF_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: FILE_TOO_LARGE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE (type not allowed, or content does not
            match type/extension)
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED (empty file, unknown location)
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Upload a private attachment
      tags:
      - attachments
  /attachments/{id}:
    get:
      description: 'Requires attachments.view and access to this attachment (location
        scope; unlinked attachments: uploader only). Attachments the caller cannot
        see return 404, so their existence is not revealed.'
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/Attachment'
              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Attachment metadata
      tags:
      - attachments
  /attachments/{id}/content:
    get:
      description: Streams the file for a link from /attachments/{id}/link. Needs
        the same user's session; access is checked again, so a revoked permission
        stops downloads at once. Every download is audited. Served with nosniff, a
        sandboxing CSP and no caching.
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      - description: attachment or inline
        in: query
        name: disposition
        required: true
        type: string
      - description: From the link
        in: query
        name: expires
        required: true
        type: string
      - description: From the link
        in: query
        name: signature
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN, DOWNLOAD_LINK_INVALID or DOWNLOAD_LINK_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Download an attachment
      tags:
      - attachments
  /attachments/{id}/link:
    get:
      description: After the same checks as metadata, returns a link that works only
        for the caller, only with their session, and only until expiresAt (ATTACHMENT_LINK_TTL,
        default 5 minutes). disposition=inline is allowed for images (preview); everything
        else downloads.
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      - description: attachment (default) or inline
        enum:
        - attachment
        - inline
        in: query
        name: disposition
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/AttachmentLink'
              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED (disposition)
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Short-lived download link
      tags:
      - attachments
  /attachments/limits:
    get:
      description: Maximum file size and accepted types (content is detected server-side;
        the declared type and the file-name extension must match it). Requires attachments.upload.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/AttachmentLimits'
              type: object
        "401":
          description: UNAUTHENTICATED or SESSION_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Upload limits
      tags:
      - attachments
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Verifies username and password and starts a server-side session.
        The session token is returned only in an HttpOnly, SameSite=Strict cookie
        (`__Host-maa_session` over HTTPS, `maa_session` in local development); the
        body carries the CSRF token for later mutations. Failures are generic: unknown
        user and wrong password both return INVALID_CREDENTIALS. ACCOUNT_DISABLED
        is only returned when the password was correct. Repeated failures return 429
        with Retry-After.'
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/Session'
              type: object
        "400":
          description: VALIDATION_FAILED or BAD_REQUEST
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: INVALID_CREDENTIALS
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: ACCOUNT_DISABLED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Sign in
      tags:
      - auth
